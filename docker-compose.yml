# 飞牛影视 SRTM 实时监控
services:
  fntv-strm-monitor:
    image: ghcr.io/gesanqiu-mjl/fntv-strm-monitor:latest
    container_name: fntv-strm-monitor
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /vol1/1000/容器/LitePan/strm/更新中:/strm/updating:ro
      - /vol1/1000/容器/LitePan/strm/海外纪录片:/strm/overseas:ro
      - /vol1/1000/容器/LitePan/strm/纪录片:/strm/doc:ro
      - ./logs:/logs
    environment:
      - TZ=Asia/Shanghai
