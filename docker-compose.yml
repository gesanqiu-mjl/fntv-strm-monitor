# 飞牛影视 SRTM 实时监控 - Docker Compose 编排
# 使用前：
#   1. 复制 config.example.yaml 为 config.yaml 并按需填写（NAS 地址/账号/secret/媒体库映射）；
#   2. 把下方 /path/to/strm/xxx 替换为 NAS 上实际的 strm 目录路径；
#   3. 目录映射中的 watch_dir 需与 config.yaml 中 libraries[].watch_dir 对应（见 README）。
services:
  fntv-strm-monitor:
    build: .
    image: fntv-strm-monitor:latest
    container_name: fntv-strm-monitor
    restart: unless-stopped
    volumes:
      # 配置文件（只读挂载）
      - ./config.yaml:/app/config.yaml:ro
      # 多个 strm 监控目录：每个目录挂到容器内固定路径，与 config.yaml 的 watch_dir 对应
      - /path/to/strm/movie1:/strm/movie1:ro
      - /path/to/strm/tv1:/strm/tv1:ro
      # 日志卷
      - ./logs:/logs
    environment:
      - TZ=Asia/Shanghai
